name: Stable Release

# 手动触发的**正式版**发布：只允许从 main 触发，产物签名与 nightly 完全一致
# （同一把 CI 专用密钥 ci/xtu-ci-release.jks），tag 形如 v0.19，默认标记为 Latest。
# 与 release.yml（main 推送自动产 nightly 预发布）互不影响。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，留空则用 v<versionName>（例如 v0.19）"
        required: false
        default: ""
      notes:
        description: "额外发布说明（可选，Markdown，会插在「近期更改」前）"
        required: false
        default: ""
      make_latest:
        description: "标记为 Latest 正式版"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

env:
  KS_FILE: ci/xtu-ci-release.jks
  KS_ALIAS: xtu
  KS_PASS: xtuCiRelease2026

jobs:
  release:
    name: Build & publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and build-tools
        run: |
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          if "$SDKMGR" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null; then
            echo "installed platforms;android-37.0"
          elif "$SDKMGR" --install "platforms;android-37" "build-tools;36.0.0" > /dev/null; then
            echo "installed platforms;android-37"
          else
            echo "::warning::sdkmanager 安装平台失败，交给 Gradle 自动下载"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::正式版只能从 main 分支触发（当前：${GITHUB_REF_NAME}）"
            exit 1
          fi
          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')"
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}"
          fi
          if [ "$TAG" != "v${VERSION_NAME}" ]; then
            echo "::warning::tag $TAG 与 app/build.gradle.kts 的 versionName ${VERSION_NAME} 不一致"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG 已存在，请换一个 tag（或先删除旧 tag）"
            exit 1
          fi
          STAMP="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "stable release tag: $TAG (versionName $VERSION_NAME / versionCode $VERSION_CODE, $STAMP Asia/Shanghai)"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lintVitalRelease --no-configuration-cache --console=plain

      - name: Sign APK
        id: sign
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -name '*-unsigned.apk' | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::未找到未签名的 release APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          APK_NAME="XtuAutoLogin-${{ steps.meta.outputs.tag }}.apk"
          "${BUILD_TOOLS}zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$KS_FILE" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "$APK_NAME" \
            aligned.apk
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK_NAME"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME"

      - name: Write release notes
        env:
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            echo "changes since $PREV"
          else
            RANGE="HEAD"
            echo "no previous stable tag, listing all commits"
          fi
          {
            echo "> 这是手动触发的正式版（Stable）发布，构建自 main 分支。"
            echo ""
            echo "## 构建信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.meta.outputs.version_name }} |"
            echo "| versionCode | ${{ steps.meta.outputs.version_code }} |"
            echo "| Tag | ${{ steps.meta.outputs.tag }} |"
            echo "| 构建时间 | ${{ steps.meta.outputs.stamp }} (Asia/Shanghai) |"
            echo "| 提交 | ${GITHUB_SHA:0:7} |"
            echo ""
            if [ -n "${EXTRA_NOTES}" ]; then
              echo "## 发布说明"
              echo ""
              echo "${EXTRA_NOTES}"
              echo ""
            fi
            echo "## 近期更改"
            echo ""
            if [ -n "$PREV" ]; then
              git log "$RANGE" --no-merges --max-count=50 --pretty=format:'- %s（%h，%an）'
            else
              git log "$RANGE" --no-merges --max-count=50 --pretty=format:'- %s（%h，%an）'
            fi
            echo ""
            echo ""
            echo "下载本页附件 XtuAutoLogin-${{ steps.meta.outputs.tag }}.apk 安装即可。"
            echo "注意：release 包签名与 debug 包不同，覆盖安装失败时请先卸载旧版（已保存的账号会被清掉）；"
            echo "但与之前各版本 release/nightly 用的是同一把密钥，可直接覆盖升级。"
          } > release_notes.md
          cat release_notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtuAutoLogin-${{ steps.meta.outputs.tag }}
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.sign.outputs.apk }}
          draft: false
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
